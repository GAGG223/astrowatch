# Pipeline do AstroWatch
#
# - Em todo push e pull request: instala dependencias, roda lint, testes e build (CI).
# - Em push na branch main: publica o build no GitHub Pages (CD).
#
# A chave da NASA vem do secret VITE_NASA_API_KEY. Se o secret nao existir
# (ex.: PR vindo de fork), a aplicacao cai automaticamente para a DEMO_KEY.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Permissoes minimas necessarias para publicar no GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita dois deploys simultaneos; o mais recente cancela o anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_NASA_API_KEY: ${{ secrets.VITE_NASA_API_KEY }}

      # So gera o artefato de publicacao quando for push na main.
      - name: Configurar Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Empacotar o build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
